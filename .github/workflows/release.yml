name: Publish Release Installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  compile-and-package:
    name: Build Channel - ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: windows
            runner: windows-latest
            rid: win-x64
            binary_name: vtt.exe
            platform: Windows
            architecture: x64
            has_installer: true
            installer_ext: msi
            archive_ext: zip
          - os: linux
            runner: ubuntu-latest
            rid: linux-x64
            binary_name: vtt
            platform: Linux
            architecture: x64
            has_installer: true
            installer_ext: deb
            archive_ext: tar.gz
          - os: macos-intel
            runner: macos-latest
            rid: osx-x64
            binary_name: vtt
            platform: macOS
            architecture: x64
            has_installer: false
            archive_ext: tar.gz
          - os: macos-silicon
            runner: macos-latest
            rid: osx-arm64
            binary_name: vtt
            platform: macOS
            architecture: arm64
            has_installer: false
            archive_ext: tar.gz

    steps:
    - name: Pull Source Code
      uses: actions/checkout@v4

    - name: Install Official .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet Dependency Tree
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Standalone Executable
      run: >
        dotnet publish VersionTaskTracker.Cli/VersionTaskTracker.Cli.csproj -c Release 
        -r ${{ matrix.rid }} 
        --self-contained true 
        -p:PublishSingleFile=true 
        -p:PublishReadyToRun=true 
        -o ./publish_output

    - name: Set Version, Channel Status, and File Names
      shell: pwsh
      run: |
        # 1. Clean out the 'v' header for names and configurations
        $rawVersion = $env:GITHUB_REF_NAME
        "VERSION=$rawVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
        
        # 2. Enforce strict matching rules to check if this is a side-channel pre-release
        if ($env:GITHUB_REF_NAME -match '^v\d+\.\d+\.\d+$') {
          "IS_PRERELEASE=false" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
          "IS_PRERELEASE=true" | Out-File -FilePath $env:GITHUB_ENV -Append
        }
        
        # 3. Formulate structural naming formats
        $baseName = "VersionTaskTracker-$rawVersion-${{ matrix.platform }}-${{ matrix.architecture }}"
        
        if ("${{ matrix.has_installer }}" -eq "true") {
          $installerName = "$baseName-Installer.${{ matrix.installer_ext }}"
          "INSTALLER_NAME=$installerName" | Out-File -FilePath $env:GITHUB_ENV -Append
        }
        
        $archiveName = "$baseName-Compressed.${{ matrix.archive_ext }}"
        "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Append
        
        # 4. Generate clean output staging directory
        New-Item -ItemType Directory -Force -Path ./dist

    - name: Package Windows Artifacts (MSI & ZIP)
      if: matrix.os == 'windows'
      shell: pwsh
      run: |
        # 1. Build the Raw Zip Archive for the upgrader
        Compress-Archive -Path ./publish_output/${{ matrix.binary_name }} -DestinationPath ./dist/$env:ARCHIVE_NAME
        
        # 2. Extract clean numeric version string for WiX structural rule constraints
        if ($env:VERSION -match '^(\d+\.\d+\.\d+)') { $msiVersion = $Matches[1] } else { $msiVersion = "1.0.0" }
        
        # 3. Create a minimal inline WiX compilation manifest (Fixing ICE80 by explicitly setting 64-bit architecture)
        $wxsConfig = @"
        <?xml version="1.0" encoding="UTF-8"?>
        <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
          <Product Id="*" Name="VersionTaskTracker" Language="1033" Version="$msiVersion" Manufacturer="MohammadAyaad" UpgradeCode="9b3e15b2-3fc2-4d22-b9e3-ec5df3427969">
            <Package InstallerVersion="200" Compressed="yes" InstallScope="perMachine" Platform="x64" />
            <MediaTemplate EmbedCab="yes" />
            <Directory Id="TARGETDIR" Name="SourceDir">
              <Directory Id="ProgramFiles64Folder">
                <Directory Id="INSTALLFOLDER" Name="VersionTaskTracker">
                  <Component Id="MainExecutable" Guid="6c5e23a1-7fd3-4bde-a359-56bf471295b4" Win64="yes">
                    <File Id="VttExe" Source="publish_output\vtt.exe" KeyPath="yes" />
                    <Environment Id="PATH" Name="PATH" Value="[INSTALLFOLDER]" Permanent="no" Part="last" Action="set" System="yes" />
                  </Component>
                </Directory>
              </Directory>
            </Directory>
            <Feature Id="ProductFeature" Title="VersionTaskTracker" Level="1">
              <ComponentRef Id="MainExecutable" />
            </Feature>
          </Product>
        </Wix>
        "@
        Set-Content -Path product.wxs -Value $wxsConfig
        
        # 4. Compile and link the installer package via the preinstalled WiX Toolset
        candle.exe product.wxs
        light.exe product.wixobj -out ./dist/$env:INSTALLER_NAME

    - name: Package Linux Debian & Raw Tarball Artifacts
      if: matrix.os == 'linux'
      run: |
        # 1. Build the Raw Tarball for the upgrader
        tar -czvf ./dist/$ARCHIVE_NAME -C ./publish_output ${{ matrix.binary_name }}

        # 2. Create standard Debian filesystem hierarchy
        mkdir -p debian_pkg/DEBIAN
        mkdir -p debian_pkg/usr/bin
        
        # 3. Copy compiled binary into target execution path
        cp ./publish_output/${{ matrix.binary_name }} debian_pkg/usr/bin/
        chmod +x debian_pkg/usr/bin/${{ matrix.binary_name }}
        
        # 4. Dynamically inject required control manifest configurations
        cat <<EOF > debian_pkg/DEBIAN/control
        Package: versiontasktracker
        Version: $VERSION
        Architecture: amd64
        Maintainer: MohammadAyaad
        Description: A local task tracker built for Git repositories.
        EOF
        
        # 5. Run system archiver to lock in the installer package
        dpkg-deb --build debian_pkg ./dist/$INSTALLER_NAME

    - name: Package macOS Artifacts (Raw Compressed Archive Only)
      if: startsWith(matrix.os, 'macos')
      run: |
        chmod +x ./publish_output/${{ matrix.binary_name }}
        # Packs exclusively the single raw tar archive
        tar -czvf ./dist/$ARCHIVE_NAME -C ./publish_output ${{ matrix.binary_name }}

    - name: Publish Artifact to GitHub Release Page
      uses: softprops/action-gh-release@v2
      with:
        files: ./dist/*
        prerelease: ${{ env.IS_PRERELEASE }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}