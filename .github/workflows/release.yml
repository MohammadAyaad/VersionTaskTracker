name: Publish Release Installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # Grants the workflow permission to write assets back to your release page

jobs:
  compile-and-package:
    name: Build Channel - ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: windows
            runner: windows-latest
            rid: win-x64
            binary_name: vtt.exe
            package_name: VersionTaskTracker-Windows-x64.zip
          - os: linux
            runner: ubuntu-latest
            rid: linux-x64
            binary_name: vtt
            package_name: versiontasktracker-linux-x64.deb
          - os: macos-intel
            runner: macos-latest
            rid: osx-x64
            binary_name: vtt
            package_name: VersionTaskTracker-Mac-Intel.tar.gz
          - os: macos-silicon
            runner: macos-latest
            rid: osx-arm64
            binary_name: vtt
            package_name: VersionTaskTracker-Mac-Silicon.tar.gz

    steps:
    - name: Pull Source Code
      uses: actions/checkout@v4

    - name: Install Official .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet Dependency Tree
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Standalone Executable
      run: >
        dotnet publish VersionTaskTracker.Cli/VersionTaskTracker.Cli.csproj -c Release 
        -r ${{ matrix.rid }} 
        --self-contained true 
        -p:PublishSingleFile=true 
        -p:PublishReadyToRun=true 
        -o ./publish_output

    - name: Package Windows Binary
      if: matrix.os == 'windows'
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish_output/${{ matrix.binary_name }} -DestinationPath ./${{ matrix.package_name }}

    - name: Package Linux Debian Binary
      if: matrix.os == 'linux'
      run: |
        # 1. Create standard Debian filesystem hierarchy
        mkdir -p debian_pkg/DEBIAN
        mkdir -p debian_pkg/usr/bin
        
        # 2. Copy compiled binary into target execution path
        cp ./publish_output/${{ matrix.binary_name }} debian_pkg/usr/bin/
        chmod +x debian_pkg/usr/bin/${{ matrix.binary_name }}
        
        # 3. Dynamically inject required control manifest configurations
        cat <<EOF > debian_pkg/DEBIAN/control
        Package: versiontasktracker
        Version: ${GITHUB_REF_NAME#v}
        Architecture: amd64
        Maintainer: MohammadAyaad
        Description: A local task tracker built for Git repositories.
        EOF
        
        # 4. Run system archiver to lock in the installer package
        dpkg-deb --build debian_pkg ./${{ matrix.package_name }}

    - name: Package macOS Binary
      if: startsWith(matrix.os, 'macos')
      run: |
        chmod +x ./publish_output/${{ matrix.binary_name }}
        tar -czvf ./${{ matrix.package_name }} -C ./publish_output ${{ matrix.binary_name }}

    - name: Publish Artifact to GitHub Release Page
      uses: softprops/action-gh-release@v2
      with:
        files: ./${{ matrix.package_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}